<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Homewellness project overview"><style>
.track { animation: glow 3s ease-in-out infinite; }
.bar { transform-box:fill-box; transform-origin:center bottom; animation:level 1.8s ease-in-out infinite; }
.b2 { animation-delay:.3s; } .b3 { animation-delay:.6s; } .b4 { animation-delay:.9s; }
@keyframes glow { 0%,100% { opacity:.35; } 50% { opacity:1; } }
@keyframes level { 0%,100% { transform:scaleY(.35); opacity:.5; } 50% { transform:scaleY(1); opacity:1; } }
@media (prefers-reduced-motion: reduce) { .track,.bar { animation:none; } }
