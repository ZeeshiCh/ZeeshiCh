<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zeeshan Zafar — Full-Stack and Mobile Software Engineer">
<style>
.pulse { animation: pulse 3s ease-in-out infinite; }
.cursor { animation: blink 1.4s step-end infinite; }
.signal { animation: drift 6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
@keyframes drift { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
@media (prefers-reduced-motion: reduce) { .pulse,.cursor,.signal { animation:none; } }
</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#13273f"/></linearGradient></defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<path d="M900 0L600 300M1050 0L750 300M1200 0L900 300" stroke="#38bdf8" class="pulse" stroke-opacity=".20" stroke-width="2"/>
<rect x="50" y="52" width="5" height="190" rx="2" fill="#38bdf8"/>
